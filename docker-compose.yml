version: '3.8'

services:
  # ================================================
  # 1. Database (PostgreSQL)
  # ================================================
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinelsecurepassword123
      POSTGRES_DB: sentineldb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentineldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # 2. Message Broker (RabbitMQ)
  # ================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sentinel-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ================================================
  # 3. Log Analytics Storage (Elasticsearch)
  # ================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: sentinel-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ================================================
  # 4. FastAPI Backend API
  # ================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinelsecurepassword123@postgres:5432/sentineldb
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - JWT_SECRET=super-secret-key-for-soc-siem-jwt-tokens-change-in-prod-1234567890
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # ================================================
  # 5. Streamlit Frontend Dashboard
  # ================================================
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    restart: always
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://sentinel:sentinelsecurepassword123@postgres:5432/sentineldb
    depends_on:
      postgres:
        condition: service_healthy
    command: streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0

  # ================================================
  # 6. Background Queue Consumer Worker
  # ================================================
  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-consumer
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentinel:sentinelsecurepassword123@postgres:5432/sentineldb
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python run_consumer.py

volumes:
  pgdata:
    driver: local
  rabbitmq_data:
    driver: local
  es_data:
    driver: local
