databases:
  - name: sentinel-db
    plan: free

services:
  # ================================================
  # 1. FastAPI Ingestion & Control API (Web Service)
  # ================================================
  - type: web
    name: sentinel-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RABBITMQ_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false

  # ================================================
  # 2. Streamlit Interactive Dashboard (Web Service)
  # ================================================
  - type: web
    name: sentinel-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run dashboard.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString

  # ================================================
  # 3. Background Queue Consumer Worker (Worker Service)
  # ================================================
  - type: worker
    name: sentinel-consumer
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_consumer.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinel-db
          property: connectionString
      - key: RABBITMQ_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
